{% extends "base.html" %}{% block title %}{{ 'Edit' if item else 'Add' }} item{% endblock %}
{% block content %}<h2>{{ 'Edit item' if item else 'Add inventory item' }}</h2>
<form class="panel" method="post"><div class="form-grid">
<label>Item name<input name="item_name" value="{{ d.item_name }}" required></label>
<label>Category<select name="category">{% for c in categories %}<option {{ 'selected' if d.category == c }}>{{ c }}</option>{% endfor %}</select></label>
<label>Quantity<input type="number" name="quantity" min="0" value="{{ d.quantity }}" required></label>
<label>Minimum required quantity<input type="number" name="minimum_quantity" min="1" value="{{ d.minimum_quantity }}" required></label>
<label>Unit<input name="unit" value="{{ d.unit }}"></label><label>Batch number<input name="batch_number" value="{{ d.batch_number }}"></label>
<label>Expiry date<input type="date" name="expiry_date" value="{{ d.expiry_date }}"></label><label>Supplier<input name="supplier" value="{{ d.supplier }}"></label>
<label class="full">Description<textarea name="description" rows="2">{{ d.description }}</textarea></label>
<label class="full"><input type="checkbox" id="is_cold_chain" name="is_cold_chain" style="width:auto" {{ 'checked' if d.is_cold_chain }}> Cold-chain storage required</label>
<div class="form-grid full" id="cold-fields"><label>Minimum temperature (°C)<input type="number" step="0.1" name="min_temperature" value="{{ d.min_temperature }}"></label>
<label>Maximum temperature (°C)<input type="number" step="0.1" name="max_temperature" value="{{ d.max_temperature }}"></label>
<label>Current temperature (°C)<input type="number" step="0.1" name="current_temperature" value="{{ d.current_temperature }}"></label></div></div>
<p>Priority is calculated automatically from quantity and minimum.</p><button class="btn">Save item</button> <a class="btn sec" href="{{ url_for('inventory') }}">Cancel</a></form>{% endblock %}
